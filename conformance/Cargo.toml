# The BDP conformance GATE workspace (Rust, wire-level) — the lockstep merge gate.
#
# Self-contained: one `cargo build` / `cargo test`, mainstream deps, no Node / DB / network.
# Pin: core spec v0.2.3 = gastownhall/bdp main @aa439827 (the #405 MERGE commit). The tier-1 gate
# (member `gate`) derives its coverage denominator LIVE from specs/generated/openapi/core.openapi.json,
# so the denominator tracks the spec instead of a frozen copy. `reference` stays pin-agnostic (it
# serves whatever InMemScope implements).
#
# subject/ holds the SUBJECT UNDER TEST — the in-memory BDP scope plus the framework-free HTTP
# server/client the cases drive. It was once called `vendor/`, which was the wrong name: it implied
# these were copies tracking an upstream, and they are not.
#
# ===========================================================================================
#  THESE CRATES ARE SUITE-INTERNAL AND CARRY NO EXTERNAL CONTRACT.
#
#  They are owned here, in gastownhall/bdp, and they exist to be measured by the conformance
#  cases next to them. There is NO semver, NO published API, NO stability promise, and no
#  upstream to track or re-vendor from. They change whenever a case needs them to.
#
#  An implementation is welcome to copy them, and then owns whatever churn follows. Do not take
#  a dependency on them expecting them to hold still. `publish = false` below enforces the
#  mechanical half of this; this comment is the half that reaches a person first.
#
#  Divergence from any similarly-named crate elsewhere is EXPECTED, not a defect to reconcile.
# ===========================================================================================
[workspace]
resolver = "2"
members = [
    "reference",
    "gate",
    "subject/bdp-primitives",
    "subject/bdp-jsonpatch",
    "subject/bdp-protocol",
    "subject/bdp-inmem",
]

# Values the subject crates inherit via `version.workspace` / `edition.workspace`.
[workspace.package]
version = "0.0.0"
edition = "2021"
license = "UNLICENSED"
publish = false
