[package]
name = "bdp-inmem"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
bdp-primitives = { path = "../bdp-primitives" }
bdp-jsonpatch = { path = "../bdp-jsonpatch" }
bytes = "1"
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
