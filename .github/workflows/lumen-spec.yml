name: lumen-spec
on:
  pull_request:
    paths: ['specs/core.lumen', 'specs/generated/core.md', 'tools/lumen/**']
  push:
    branches: ['spec/core-v0.2']
    paths: ['specs/core.lumen', 'specs/generated/core.md', 'tools/lumen/**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Build spec artifacts (no Rust, no network)
        run: ./tools/lumen/build-spec.sh
      - name: Generated reference is in sync with core.lumen
        run: |
          git diff --exit-code -- specs/generated/core.md \
            || { echo "::error::specs/generated/core.md is stale — run tools/lumen/build-spec.sh and commit the result."; exit 1; }
      - name: Validate JSON artifacts
        run: |
          python3 -m json.tool build/openapi.json > /dev/null
          python3 -m json.tool build/schema.bundle.json > /dev/null
          echo "openapi.json and schema.bundle.json are well-formed"
      - uses: actions/upload-artifact@v4.4.3
        with:
          name: core-spec-artifacts
          path: |
            build/
            specs/generated/core.md
