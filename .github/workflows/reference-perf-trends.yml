name: Reference performance trends

on:
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reference-perf-trends-main
  cancel-in-progress: false

jobs:
  reference-trends:
    # Scheduled runs use the default branch; manual observations also use main.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.22.1
          cache: pnpm
      - run: test "$(node --version)" = "v24.22.1" && test "$(pnpm --version)" = "11.20.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Observe small and medium workloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/reference-perf"
          status=0
          pnpm exec node scripts/perf/reference-trends.mjs --output "$RUNNER_TEMP/reference-perf/small.json" 2>&1 | tee "$RUNNER_TEMP/reference-perf/small.log" || status=1
          pnpm exec node scripts/perf/reference-trends.mjs --scale medium --output "$RUNNER_TEMP/reference-perf/medium.json" 2>&1 | tee "$RUNNER_TEMP/reference-perf/medium.log" || status=1
          exit "$status"
      - name: Upload observations including failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reference-perf-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/reference-perf/
          if-no-files-found: warn
          retention-days: 90
